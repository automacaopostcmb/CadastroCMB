<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
  body.auth-pending .wizard-topbar,
  body.auth-pending .page-center > *:not(#overlay) {
    visibility: hidden;
  }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(255,255,255,0.92);
    display: grid;
  }
</style>
  
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Criar novo código – CMB</title>

  <link rel="stylesheet" href="style.css?v=52">

  <style>
    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
      text-align: left;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    .admin-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      color: #222;
    }

    .admin-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: 0 0 auto;
    }

    .admin-result {
      margin-top: 18px;
      display: none;
    }

    .admin-code-box {
      text-align: center;
      margin: 10px 0 22px;
    }

    .admin-code-label {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .admin-code {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #111;
      word-break: break-word;
    }

    .admin-msg {
      width: 100%;
      min-height: 140px;
      border-radius: 12px;
      border: 1px solid #cfd8e3;
      padding: 14px;
      font-size: 15px;
      resize: vertical;
      box-sizing: border-box;
    }

    .admin-feedback {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .admin-block-title {
      margin-top: 34px;
    }

    .admin-edit-box {
      margin-top: 18px;
      display: none;
    }

    .codigo-encontrado {
      font-size: 14px;
      text-align: center;
      margin-top: 8px;
      color: #444;
      font-weight: 700;
    }

    .confirmar-exclusao-box {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff8f8;
      text-align: center;
      display: none;
    }

    .confirmar-exclusao-texto {
      font-size: 16px;
      font-weight: 700;
      color: #8b0000;
    }
  </style>
</head>
<body class="auth-pending">
<header class="wizard-topbar" role="banner" aria-label="Administrador">
  <div class="wizard-topbar__inner">
    <div class="wizard-topbar__title">ADMINISTRADOR</div>
  </div>
</header>

<main class="page-center">
  <div id="wizardStepTitle" class="wizard-step-title">CRIAR NOVO CÓDIGO</div>

  <section class="step active">
    <div class="step-box">
      <label class="title-label">Para quem você vai enviar esse código de acesso?</label>
      <input type="text" id="nomeDestinatario" placeholder="Nome da pessoa ou empresa" />

      <label class="title-label" style="margin-top:20px;">Quais páginas esse código terá acesso?</label>
      <div id="listaPermissoes" class="admin-list"></div>

      <div class="button-row" style="margin-top:22px;">
        <button id="btnGerarCodigo" class="btn-nav btn-proximo">Gerar código</button>
      </div>

      <div id="adminFeedback" class="admin-feedback"></div>

      <div id="adminResult" class="admin-result">
        <div class="admin-code-box">
          <div class="admin-code-label">Novo código:</div>
          <div id="novoCodigo" class="admin-code"></div>
        </div>

        <textarea id="mensagemPronta" class="admin-msg" readonly></textarea>

        <div class="button-row" style="margin-top:16px;">
          <button id="btnCopiarMensagem" class="btn-nav btn-proximo">Copiar mensagem</button>
        </div>
      </div>
    </div>

    <div class="wizard-step-title admin-block-title">ALTERAR CÓDIGO</div>

    <div class="step-box">
      <label class="title-label">Qual código você quer alterar?</label>
      <input type="text" id="codigoAlterar" placeholder="Digite o código" />

      <div class="button-row" style="margin-top:22px;">
        <button id="btnBuscarCodigo" class="btn-nav btn-proximo">Atualizar</button>
      </div>

      <div id="alterarFeedback" class="admin-feedback"></div>

      <div id="alterarBox" class="admin-edit-box">
        <div id="codigoEncontrado" class="codigo-encontrado"></div>

        <label class="title-label" style="margin-top:20px;">Quais páginas esse código terá acesso?</label>
        <div id="listaPermissoesAlterar" class="admin-list"></div>

        <div class="button-row" style="margin-top:22px;">
          <button id="btnAlterarCodigo" class="btn-nav btn-proximo">Alterar</button>
        </div>

        <div id="confirmarExclusaoBox" class="confirmar-exclusao-box">
          <div class="confirmar-exclusao-texto">Você quer apagar esse código?</div>

          <div class="button-row" style="margin-top:14px;">
            <button id="btnConfirmarExcluirSim" class="btn-nav btn-proximo" type="button">Sim</button>
            <button id="btnConfirmarExcluirNao" class="btn-nav btn-light" type="button">Não</button>
          </div>
        </div>
      </div>
    </div>

    <a class="btn-light-text" href="index.html?back=1">Voltar para o Menu</a>
  </section>
</main>
  
<div id="overlay" style="display:grid;">
  <div class="loader">
    <img src="assets/loading.gif" alt="Carregando" class="loader-gif">
    <div class="loader-text">Verificando acesso...</div>
  </div>
</div>
  
<script>
const AUTH_URL = "https://script.google.com/macros/s/AKfycbyMbkkFdzYC_BfMsi5WKW6xbOKdjbNbW635vovOLYHGXdso2S_1a2Wdfvur790y0BM46g/exec";
const ADMIN_URL = "https://script.google.com/macros/s/AKfycbyNlxliAYm01ZdIpEdc43MFVLQt2OrCBrc7e1MNtWICgrGXlUeKd5kPKXntmPyn7QUDcQ/exec";
const PAGINA = "mestre";

let permissoesDisponiveis = [];
let codigoEmEdicao = "";

function setOverlay(show, text) {
  const overlay = document.getElementById("overlay");
  const label = overlay?.querySelector(".loader-text");
  if (label) label.textContent = text || "Carregando...";
  if (overlay) overlay.style.display = show ? "grid" : "none";
}

function closeOverlayNow() {
  const overlay = document.getElementById("overlay");
  if (overlay) overlay.style.display = "none";
}

  function overlayTimeout(ms = 8000) {
  setTimeout(() => {
    closeOverlayNow();
  }, ms);
}
  
function showFeedback(msg, ok = false) {
  const el = document.getElementById("adminFeedback");
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
  el.style.color = ok ? "green" : "red";
}

function showAlterarFeedback(msg, ok = false) {
  const el = document.getElementById("alterarFeedback");
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
  el.style.color = ok ? "green" : "red";
}

function mostrarConfirmacaoExclusao() {
  const box = document.getElementById("confirmarExclusaoBox");
  if (box) box.style.display = "block";
}

function esconderConfirmacaoExclusao() {
  const box = document.getElementById("confirmarExclusaoBox");
  if (box) box.style.display = "none";
}

function getChave() {
  return (localStorage.getItem("chave") || "").trim();
}

async function checkAuth() {
  const chave = getChave();
  if (!chave) {
    setOverlay(true, "Faça login primeiro.");
    setTimeout(() => window.location.href = "index.html", 1200);
    return false;
  }

  try {
    const url = `${AUTH_URL}?chave=${encodeURIComponent(chave)}&pagina=${encodeURIComponent(PAGINA)}&v=${Date.now()}`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (!data.ok || !data.permitido) {
      setOverlay(true, "Você não tem permissão para acessar esta página.");
      setTimeout(() => window.location.href = "index.html", 1400);
      return false;
    }

    return true;
  } catch (e) {
    setOverlay(true, "Erro ao validar acesso.");
    setTimeout(() => window.location.href = "index.html", 1400);
    return false;
  }
}

const LABELS_PAGINAS = {
  expo_artistas: "Novo Artista/mesa",
  expo_business: "Expositor Business",
  expo_market: "Expositor Market",
  cadastro_masterclass: "Cadastro aula/learning",
  cadastro_lancamento: "Artista/Lançamento no evento",
  eu_vou: "Eu vou CMB 2026!",
  convidado: "Convidado confirmado!"
};

function formatarNomePermissao(nome) {
  return LABELS_PAGINAS[nome] || String(nome || "")
    .replace(/_/g, " ")
    .replace(/\b\w/g, l => l.toUpperCase());
}

function renderListaPermissoes(containerId, permissoes, marcadas = []) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;

  wrap.innerHTML = "";
  const marcadasSet = new Set(marcadas);

  permissoes.forEach((perm) => {
    const item = document.createElement("label");
    item.className = "admin-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = perm;
    cb.checked = marcadasSet.has(perm);

    const text = document.createElement("span");
    text.textContent = formatarNomePermissao(perm);

    item.appendChild(cb);
    item.appendChild(text);
    wrap.appendChild(item);
  });
}

async function carregarPermissoes() {
  const chave = getChave();

  try {
    const url = `${ADMIN_URL}?action=listPermissoes&chave=${encodeURIComponent(chave)}&v=${Date.now()}`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (!data.ok) {
      throw new Error(data.message || "Erro ao carregar permissões.");
    }

    let permissoes = data.permissoes || [];

    if (!Array.isArray(permissoes)) {
      if (typeof permissoes === "object" && permissoes !== null) {
        permissoes = Object.keys(permissoes);
      } else {
        permissoes = [];
      }
    }

    if (!permissoes.length) {
      throw new Error("Nenhuma permissão encontrada.");
    }

    permissoesDisponiveis = permissoes.slice();
    renderListaPermissoes("listaPermissoes", permissoesDisponiveis);
    renderListaPermissoes("listaPermissoesAlterar", permissoesDisponiveis);

  } catch (e) {
    console.error(e);
    showFeedback(e.message || "Erro ao carregar permissões.");
  }
}

function getPermissoesMarcadas(containerId) {
  return Array.from(document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`))
    .map(el => el.value);
}

function montarMensagem(codigo) {
  return `Entre nesse link: https://cadastrocomicmarketbrasil.com.br/
E use o código ${codigo} para criar a sua divulgação!`;
}

async function gerarCodigo() {
  const nome = (document.getElementById("nomeDestinatario").value || "").trim();
  const paginas = getPermissoesMarcadas("listaPermissoes");
  const chaveAdmin = getChave();

  if (!nome) {
    showFeedback("Preencha o nome.");
    return;
  }

  if (!paginas.length) {
    showFeedback("Selecione ao menos uma página.");
    return;
  }

setOverlay(true, "Gerando código...");
overlayTimeout();
  showFeedback("");

  try {
    const resp = await fetch(ADMIN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "criarCodigo",
        chaveAdmin,
        nome,
        paginas
      })
    });

    const raw = await resp.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Resposta inválida do servidor.");
    }

    if (!data.ok) {
      throw new Error(data.message || "Erro ao criar código.");
    }

    const codigo = data.codigo;
    const mensagem = montarMensagem(codigo);

    closeOverlayNow();

    document.getElementById("novoCodigo").textContent = codigo;
    document.getElementById("mensagemPronta").value = mensagem;
    document.getElementById("adminResult").style.display = "block";

    try {
      await navigator.clipboard.writeText(mensagem);
      showFeedback("Código criado e mensagem copiada.", true);
    } catch (e) {
      showFeedback("Código criado com sucesso.", true);
    }

    document.getElementById("nomeDestinatario").value = "";
    document.getElementById("nomeDestinatario").focus();

    setTimeout(() => {
      document.getElementById("adminResult")?.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }, 50);

  } catch (e) {
    console.error(e);
    closeOverlayNow();
    showFeedback(e.message || "Erro ao criar código.");
  }
}

async function copiarMensagem() {
  const box = document.getElementById("mensagemPronta");
  const btn = document.getElementById("btnCopiarMensagem");
  if (!box) return;

  try {
    await navigator.clipboard.writeText(box.value);
    const old = btn.textContent;
    btn.textContent = "Copiado ✔";
    setTimeout(() => btn.textContent = old, 1500);
  } catch (e) {
    box.select();
    document.execCommand("copy");
    const old = btn.textContent;
    btn.textContent = "Copiado ✔";
    setTimeout(() => btn.textContent = old, 1500);
  }
}

function resetAlterarBloco() {
  codigoEmEdicao = "";
  document.getElementById("codigoAlterar").value = "";
  document.getElementById("codigoEncontrado").textContent = "";
  document.getElementById("alterarBox").style.display = "none";
  showAlterarFeedback("");
  esconderConfirmacaoExclusao();
  renderListaPermissoes("listaPermissoesAlterar", permissoesDisponiveis);
}

async function buscarCodigoParaAlterar() {
  const codigo = (document.getElementById("codigoAlterar").value || "").trim();
  const chave = getChave();

  showAlterarFeedback("");
  esconderConfirmacaoExclusao();
  document.getElementById("alterarBox").style.display = "none";
  document.getElementById("codigoEncontrado").textContent = "";

  if (!codigo) {
    showAlterarFeedback("Digite um código.");
    return;
  }

  setOverlay(true, "Buscando código...");
overlayTimeout();
  try {
    const url = `${ADMIN_URL}?action=buscarCodigo&chave=${encodeURIComponent(chave)}&codigo=${encodeURIComponent(codigo)}&v=${Date.now()}`;
    const resp = await fetch(url);
    const data = await resp.json();

    closeOverlayNow();

    if (!data.ok) {
      showAlterarFeedback(data.message || "Esse código não existe!");
      return;
    }

    codigoEmEdicao = data.codigo || codigo;
    document.getElementById("codigoEncontrado").textContent = `Código encontrado: ${codigoEmEdicao}`;
    renderListaPermissoes("listaPermissoesAlterar", permissoesDisponiveis, data.paginas || []);
    document.getElementById("alterarBox").style.display = "block";

  } catch (e) {
    console.error(e);
    closeOverlayNow();
    showAlterarFeedback("Erro ao buscar código.");
  }
}

async function alterarCodigo() {
  const chaveAdmin = getChave();
  const paginas = getPermissoesMarcadas("listaPermissoesAlterar");

  if (!codigoEmEdicao) {
    showAlterarFeedback("Busque um código primeiro.");
    return;
  }

  if (!paginas.length) {
    showAlterarFeedback("");
    mostrarConfirmacaoExclusao();
    return;
  }

  esconderConfirmacaoExclusao();
  setOverlay(true, "Alterando código...");
  showAlterarFeedback("");

  try {
    const resp = await fetch(ADMIN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "alterarCodigo",
        chaveAdmin,
        codigo: codigoEmEdicao,
        paginas
      })
    });

    const raw = await resp.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Resposta inválida do servidor.");
    }

    closeOverlayNow();

    if (!data.ok) {
      showAlterarFeedback(data.message || "Erro ao alterar código.");
      return;
    }

    resetAlterarBloco();
    showAlterarFeedback("Código alterado com sucesso.", true);

  } catch (e) {
    console.error(e);
    closeOverlayNow();
    showAlterarFeedback(e.message || "Erro ao alterar código.");
  }
}

async function excluirCodigo() {
  const chaveAdmin = getChave();

  if (!codigoEmEdicao) {
    showAlterarFeedback("Busque um código primeiro.");
    esconderConfirmacaoExclusao();
    return;
  }

  setOverlay(true, "Apagando código...");
  showAlterarFeedback("");

  try {
    const resp = await fetch(ADMIN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "excluirCodigo",
        chaveAdmin,
        codigo: codigoEmEdicao
      })
    });

    const raw = await resp.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Resposta inválida do servidor.");
    }

    closeOverlayNow();

    if (!data.ok) {
      showAlterarFeedback(data.message || "Erro ao apagar código.");
      return;
    }

    resetAlterarBloco();
    showAlterarFeedback("Código apagado com sucesso.", true);

  } catch (e) {
    console.error(e);
    closeOverlayNow();
    showAlterarFeedback(e.message || "Erro ao apagar código.");
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  setOverlay(true, "Verificando acesso...");

  const ok = await checkAuth();
  if (!ok) return;

  setOverlay(true, "Carregando permissões...");
  await carregarPermissoes();

  document.body.classList.remove("auth-pending");
  closeOverlayNow();

  document.getElementById("btnGerarCodigo")?.addEventListener("click", gerarCodigo);
  document.getElementById("btnCopiarMensagem")?.addEventListener("click", copiarMensagem);
  document.getElementById("btnBuscarCodigo")?.addEventListener("click", buscarCodigoParaAlterar);
  document.getElementById("btnAlterarCodigo")?.addEventListener("click", alterarCodigo);
  document.getElementById("btnConfirmarExcluirSim")?.addEventListener("click", excluirCodigo);
  document.getElementById("btnConfirmarExcluirNao")?.addEventListener("click", () => {
    esconderConfirmacaoExclusao();
    showAlterarFeedback("");
  });
});
</script>

<script src="footer-loader.js"></script>
</body>
</html>
