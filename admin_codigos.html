<script>
const AUTH_URL = "https://script.google.com/macros/s/AKfycbyMbkkFdzYC_BfMsi5WKW6xbOKdjbNbW635vovOLYHGXdso2S_1a2Wdfvur790y0BM46g/exec";
const ADMIN_URL = "https://script.google.com/macros/s/AKfycbyNlxliAYm01ZdIpEdc43MFVLQt2OrCBrc7e1MNtWICgrGXlUeKd5kPKXntmPyn7QUDcQ/exec";
const PAGINA = "mestre";

let permissoesDisponiveis = [];
let codigoEmEdicao = "";

  /* ===== INÍCIO MÓDULO CÓDIGOS DE ENTRADA ===== */

let codigoRecemCriado = "";
let quantidadeEntradas = 1;

/* ===== FIM MÓDULO CÓDIGOS DE ENTRADA ===== */
  
function setOverlay(show, text) {
  const overlay = document.getElementById("overlay");
  const label = overlay?.querySelector(".loader-text");
  if (label) label.textContent = text || "Carregando...";
  if (overlay) overlay.style.display = show ? "grid" : "none";
}

function closeOverlayNow() {
  const overlay = document.getElementById("overlay");
  if (overlay) overlay.style.display = "none";
}

  function overlayTimeout(ms = 8000) {
  setTimeout(() => {
    closeOverlayNow();
  }, ms);
}
  
function showFeedback(msg, ok = false) {
  const el = document.getElementById("adminFeedback");
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
  el.style.color = ok ? "green" : "red";
}

function showAlterarFeedback(msg, ok = false) {
  const el = document.getElementById("alterarFeedback");
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
  el.style.color = ok ? "green" : "red";
}

function mostrarConfirmacaoExclusao() {
  const box = document.getElementById("confirmarExclusaoBox");
  if (box) box.style.display = "block";
}

function esconderConfirmacaoExclusao() {
  const box = document.getElementById("confirmarExclusaoBox");
  if (box) box.style.display = "none";
}

let chaveAdminSessao = "";

function getChave() {
  const chaveLocal = (localStorage.getItem("chave") || "").trim();

  if (chaveLocal) {
    chaveAdminSessao = chaveLocal;
  }

  return chaveAdminSessao;
}

async function checkAuth() {
  const chave = getChave();
  if (!chave) {
    setOverlay(true, "Faça login primeiro.");
    setTimeout(() => window.location.href = "index.html", 1200);
    return false;
  }

  try {
    const url = `${AUTH_URL}?chave=${encodeURIComponent(chave)}&pagina=${encodeURIComponent(PAGINA)}&v=${Date.now()}`;
const resp = await fetch(url);
const raw = await resp.text();

let data;

try {
  data = JSON.parse(raw);
} catch (e) {
  throw new Error("Resposta inválida do servidor.");
}

    if (!data.ok || !data.permitido) {
      setOverlay(true, "Você não tem permissão para acessar esta página.");
      setTimeout(() => window.location.href = "index.html", 1400);
      return false;
    }

    return true;
  } catch (e) {
    setOverlay(true, "Erro ao validar acesso.");
    setTimeout(() => window.location.href = "index.html", 1400);
    return false;
  }
}

const LABELS_PAGINAS = {
  expo_artistas: "Novo Artista/mesa",
  lancamento: "Lançamento no evento/artista",
  expo_business: "Expositor Business",
  expo_market: "Expositor Market",
  cadastro_masterclass: "Cadastro aula/learning",
  cadastro_lancamento: "Artista/Lançamento no evento",
  eu_vou: "Eu vou CMB 2026!",
  convidado: "Convidado confirmado!"
};

function formatarNomePermissao(nome) {
  return LABELS_PAGINAS[nome] || String(nome || "")
    .replace(/_/g, " ")
    .replace(/\b\w/g, l => l.toUpperCase());
}

function renderListaPermissoes(containerId, permissoes, marcadas = []) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;

  wrap.innerHTML = "";
  const marcadasSet = new Set(marcadas);

  permissoes.forEach((perm) => {
    const item = document.createElement("label");
    item.className = "admin-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = perm;
    cb.checked = marcadasSet.has(perm);

    const text = document.createElement("span");
    text.textContent = formatarNomePermissao(perm);

    item.appendChild(cb);
    item.appendChild(text);
    wrap.appendChild(item);
  });
}

async function carregarPermissoes() {
  const chave = getChave();

  try {
    const url = `${ADMIN_URL}?action=listPermissoes&chave=${encodeURIComponent(chave)}&v=${Date.now()}`;
const resp = await fetch(url);
const raw = await resp.text();

let data;

try {
  data = JSON.parse(raw);
} catch (e) {
  throw new Error("O servidor retornou uma resposta inválida. Recarregue a página.");
}

    if (!data.ok) {
      throw new Error(data.message || "Erro ao carregar permissões.");
    }

    let permissoes = data.permissoes || [];

    if (!Array.isArray(permissoes)) {
      if (typeof permissoes === "object" && permissoes !== null) {
        permissoes = Object.keys(permissoes);
      } else {
        permissoes = [];
      }
    }

    if (!permissoes.length) {
      throw new Error("Nenhuma permissão encontrada.");
    }

    permissoesDisponiveis = permissoes.slice();
    renderListaPermissoes("listaPermissoes", permissoesDisponiveis);
    renderListaPermissoes("listaPermissoesAlterar", permissoesDisponiveis);

  } catch (e) {
    console.error(e);
    showFeedback(e.message || "Erro ao carregar permissões.");
  }
}

async function carregarCodigosAlteraveis() {
  const chave = getChave();
  const select = document.getElementById("codigoAlterar");

  if (!select) return;

  select.innerHTML = '<option value="">Carregando...</option>';
  select.disabled = true;

  try {
    const url = `${ADMIN_URL}?action=listCodigos&chave=${encodeURIComponent(chave)}&v=${Date.now()}`;

const resp = await fetch(url);
const raw = await resp.text();

let data;

try {
  data = JSON.parse(raw);
} catch (e) {
  throw new Error(
    "O servidor retornou uma resposta inválida. Recarregue a página."
  );
}

    if (!data.ok) {
      throw new Error(data.message || "Erro ao carregar códigos.");
    }

    select.innerHTML = '<option value="">Selecione um nome</option>';

    const codigos = data.codigos || [];

    codigos.forEach(item => {
      const option = document.createElement("option");

      // O código fica escondido como valor
      option.value = item.codigo;

      // O usuário vê apenas o nome
      option.textContent = item.nome;

      select.appendChild(option);
    });

    select.disabled = false;

  } catch (e) {
    console.error(e);

    select.innerHTML = '<option value="">Erro ao carregar nomes</option>';

    showAlterarFeedback(
      e.message || "Erro ao carregar códigos."
    );
  }
}
  
function getPermissoesMarcadas(containerId) {
  return Array.from(document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`))
    .map(el => el.value);
}

function montarMensagem(codigo) {
  return `Entre nesse link: https://cadastrocomicmarketbrasil.com.br/
E use o código ${codigo} para criar a sua divulgação!`;
}

async function gerarCodigo() {
  const nome = (document.getElementById("nomeDestinatario").value || "").trim();
  const paginas = getPermissoesMarcadas("listaPermissoes");
  const chaveAdmin = getChave();
  const inputsEntradas = Array.from(
  document.querySelectorAll("#listaEntradas .entrada-cmb-input")
);

const entradas = inputsEntradas
  .map(input => input.value.trim())
  .filter(valor => valor !== "");

  if (!nome) {
    showFeedback("Preencha o nome.");
    return;
  }

  if (!paginas.length) {
    showFeedback("Selecione ao menos uma página.");
    return;
  }

setOverlay(true, "Gerando código...");
overlayTimeout();
  showFeedback("");

  try {
    const resp = await fetch(ADMIN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
   body: JSON.stringify({
  action: "criarCodigo",
  chaveAdmin,
  nome,
  paginas,
  entradas
})
    });

    const raw = await resp.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Resposta inválida do servidor.");
    }

    if (!data.ok) {
      throw new Error(data.message || "Erro ao criar código.");
    }

const codigo = data.codigo;
const mensagem = montarMensagem(codigo);

closeOverlayNow();



document.getElementById("novoCodigo").textContent = codigo;
document.getElementById("mensagemPronta").value = mensagem;
document.getElementById("adminResult").style.display = "block";


    try {
      await navigator.clipboard.writeText(mensagem);
      showFeedback("Código criado e mensagem copiada.", true);
    } catch (e) {
      showFeedback("Código criado com sucesso.", true);
    }

document.getElementById("nomeDestinatario").value = "";
document.getElementById("nomeDestinatario").focus();

quantidadeEntradas = 1;

document.getElementById("listaEntradas").innerHTML = "";
renderEntradas();

showEntradasFeedback("");
    
adicionarCodigoAoDropdown(data.codigo, data.nome);

  } catch (e) {
    console.error(e);
    closeOverlayNow();
    showFeedback(e.message || "Erro ao criar código.");
  }
}

async function copiarMensagem() {
  const box = document.getElementById("mensagemPronta");
  const btn = document.getElementById("btnCopiarMensagem");
  if (!box) return;

  try {
    await navigator.clipboard.writeText(box.value);
    const old = btn.textContent;
    btn.textContent = "Copiado ✔";
    setTimeout(() => btn.textContent = old, 1500);
  } catch (e) {
    box.select();
    document.execCommand("copy");
    const old = btn.textContent;
    btn.textContent = "Copiado ✔";
    setTimeout(() => btn.textContent = old, 1500);
  }
}

function resetAlterarBloco() {
  codigoEmEdicao = "";

  document.getElementById("codigoAlterar").value = "";
  document.getElementById("codigoEncontrado").textContent = "";
  document.getElementById("alterarBox").style.display = "none";

  showAlterarFeedback("");
  esconderConfirmacaoExclusao();

  renderListaPermissoes(
    "listaPermissoesAlterar",
    permissoesDisponiveis
  );
}

async function buscarCodigoParaAlterar() {
  const select = document.getElementById("codigoAlterar");
  const codigo = (select.value || "").trim();
  const chave = getChave();

  showAlterarFeedback("");
  esconderConfirmacaoExclusao();

  document.getElementById("alterarBox").style.display = "none";
  document.getElementById("codigoEncontrado").textContent = "";

  codigoEmEdicao = "";

  if (!codigo) {
    return;
  }

  setOverlay(true, "Carregando código...");
  overlayTimeout();

  try {
    const url = `${ADMIN_URL}?action=buscarCodigo&chave=${encodeURIComponent(chave)}&codigo=${encodeURIComponent(codigo)}&v=${Date.now()}`;

const resp = await fetch(url);
const raw = await resp.text();

let data;

try {
  data = JSON.parse(raw);
} catch (e) {
  throw new Error("O servidor retornou uma resposta inválida. Recarregue a página.");
}

    closeOverlayNow();

    if (!data.ok) {
      showAlterarFeedback(
        data.message || "Esse código não existe!"
      );
      return;
    }

    codigoEmEdicao = data.codigo || codigo;

    document.getElementById("codigoEncontrado").textContent =
      `Código: ${codigoEmEdicao}`;

    renderListaPermissoes(
      "listaPermissoesAlterar",
      permissoesDisponiveis,
      data.paginas || []
    );
    renderEntradasAlterar(data.entradas || []);

    document.getElementById("alterarBox").style.display = "block";

  } catch (e) {
    console.error(e);
    closeOverlayNow();
    showAlterarFeedback("Erro ao carregar código.");
  }
}

async function alterarCodigo() {
  const chaveAdmin = getChave();
  const paginas = getPermissoesMarcadas("listaPermissoesAlterar");

const inputsEntradas = Array.from(
  document.querySelectorAll("#listaEntradasAlterar .entrada-cmb-input")
);

const entradas = inputsEntradas
  .map(input => input.value.trim())
  .filter(valor => valor !== "");
  
  if (!codigoEmEdicao) {
    showAlterarFeedback("Busque um código primeiro.");
    return;
  }

  if (!paginas.length) {
    showAlterarFeedback("");
    mostrarConfirmacaoExclusao();
    return;
  }

  esconderConfirmacaoExclusao();
  setOverlay(true, "Alterando código...");
  showAlterarFeedback("");

  try {
    const resp = await fetch(ADMIN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
 body: JSON.stringify({
  action: "alterarCodigo",
  chaveAdmin,
  codigo: codigoEmEdicao,
  paginas,
  entradas
})
    });

    const raw = await resp.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Resposta inválida do servidor.");
    }

    closeOverlayNow();

    if (!data.ok) {
      showAlterarFeedback(data.message || "Erro ao alterar código.");
      return;
    }

    resetAlterarBloco();
    showAlterarFeedback("Código alterado com sucesso.", true);

  } catch (e) {
    console.error(e);
    closeOverlayNow();
    showAlterarFeedback(e.message || "Erro ao alterar código.");
  }
}

async function excluirCodigo() {
  const chaveAdmin = getChave();

  if (!codigoEmEdicao) {
    showAlterarFeedback("Busque um código primeiro.");
    esconderConfirmacaoExclusao();
    return;
  }

  setOverlay(true, "Apagando código...");
  showAlterarFeedback("");

  try {
    const resp = await fetch(ADMIN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "excluirCodigo",
        chaveAdmin,
        codigo: codigoEmEdicao
      })
    });

    const raw = await resp.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("Resposta inválida do servidor.");
    }

    closeOverlayNow();

    if (!data.ok) {
      showAlterarFeedback(data.message || "Erro ao apagar código.");
      return;
    }

removerCodigoDoDropdown(codigoEmEdicao);

resetAlterarBloco();

showAlterarFeedback("Código apagado com sucesso.", true);

  } catch (e) {
    console.error(e);
    closeOverlayNow();
    showAlterarFeedback(e.message || "Erro ao apagar código.");
  }
}
function adicionarCodigoAoDropdown(codigo, nome) {
  const select = document.getElementById("codigoAlterar");
  if (!select || !codigo) return;

  // Evita duplicar caso já exista
  const jaExiste = Array.from(select.options).some(
    option => option.value === codigo
  );

  if (jaExiste) return;

  const option = document.createElement("option");
  option.value = codigo;
  option.textContent = nome || "Sem nome";

  select.appendChild(option);

  // Mantém em ordem alfabética
  const opcoes = Array.from(select.options)
    .filter(option => option.value !== "")
    .sort((a, b) =>
      a.textContent.localeCompare(b.textContent, "pt-BR")
    );

  select.innerHTML = '<option value="">Selecione um nome</option>';

  opcoes.forEach(option => {
    select.appendChild(option);
  });
}

  function removerCodigoDoDropdown(codigo) {
  const select = document.getElementById("codigoAlterar");

  if (!select || !codigo) return;

  const option = Array.from(select.options).find(
    item => item.value === codigo
  );

  if (option) {
    option.remove();
  }
}

/* ===== INÍCIO MÓDULO CÓDIGOS DE ENTRADA ===== */

function renderEntradas() {
  const lista = document.getElementById("listaEntradas");
  if (!lista) return;

  const valoresAtuais = Array.from(
    lista.querySelectorAll(".entrada-cmb-input")
  ).map(input => input.value);

  lista.innerHTML = "";

  for (let i = 0; i < quantidadeEntradas; i++) {
    const input = document.createElement("input");

    input.type = "text";
    input.className = "entrada-cmb-input";
    input.placeholder = `Código de entrada ${i + 1}`;
    input.value = valoresAtuais[i] || "";

    input.addEventListener("input", atualizarBotoesEntradas);

    lista.appendChild(input);
  }

  atualizarBotoesEntradas();
}


function atualizarBotoesEntradas() {
  const inputs = Array.from(
document.querySelectorAll("#listaEntradas .entrada-cmb-input")
  );

  const btnMais = document.getElementById("btnAdicionarEntrada");
  const btnMenos = document.getElementById("btnRemoverEntrada");

  if (!inputs.length) return;

  const ultimoPreenchido =
    inputs[inputs.length - 1].value.trim() !== "";

  if (btnMais) {
    btnMais.disabled =
      !ultimoPreenchido ||
      quantidadeEntradas >= 10;
  }

  if (btnMenos) {
    btnMenos.disabled =
      quantidadeEntradas <= 1;
  }
}


function adicionarEntrada() {
  const inputs = Array.from(
document.querySelectorAll("#listaEntradas .entrada-cmb-input")
  );

  if (!inputs.length) return;

  const ultimoInput = inputs[inputs.length - 1];

  if (!ultimoInput.value.trim()) {
    showEntradasFeedback(
      "Preencha o código atual antes de adicionar outro."
    );

    ultimoInput.focus();
    return;
  }

  if (quantidadeEntradas >= 10) {
    showEntradasFeedback(
      "O limite é de 10 códigos de entrada."
    );
    return;
  }

  showEntradasFeedback("");

  quantidadeEntradas++;

  renderEntradas();

const novosInputs = document.querySelectorAll(
  "#listaEntradas .entrada-cmb-input"
);

  novosInputs[novosInputs.length - 1]?.focus();
}


function removerEntrada() {
  if (quantidadeEntradas <= 1) return;

  quantidadeEntradas--;

  renderEntradas();

  showEntradasFeedback("");
}


function showEntradasFeedback(msg, ok = false) {
  const el = document.getElementById("entradasFeedback");
  if (!el) return;

  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
  el.style.color = ok ? "green" : "red";
}


async function salvarEntradas() {
  if (!codigoRecemCriado) {
    showEntradasFeedback(
      "Gere um código primeiro."
    );
    return;
  }

const inputs = Array.from(
  document.querySelectorAll("#listaEntradas .entrada-cmb-input")
);

  /*
    Segurança extra:
    nenhuma textbox visível pode estar vazia.
  */
  const vazio = inputs.find(
    input => !input.value.trim()
  );

  if (vazio) {
    showEntradasFeedback(
      "Preencha todos os códigos de entrada antes de salvar."
    );

    vazio.focus();
    return;
  }

  const entradas = inputs.map(
    input => input.value.trim()
  );

  if (!entradas.length) {
    showEntradasFeedback(
      "Digite ao menos um código de entrada."
    );
    return;
  }

  const chaveAdmin = getChave();

  setOverlay(true, "Salvando entradas...");
  showEntradasFeedback("");

  try {
    const resp = await fetch(ADMIN_URL, {
      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        action: "salvarEntradas",
        chaveAdmin,
        codigo: codigoRecemCriado,
        entradas
      })
    });

    const data = await resp.json();

    closeOverlayNow();

    if (!data.ok) {
      showEntradasFeedback(
        data.message || "Erro ao salvar entradas."
      );
      return;
    }

    showEntradasFeedback(
      "Entradas salvas com sucesso.",
      true
    );

    document
  .querySelectorAll("#listaEntradas .entrada-cmb-input")
  .forEach(input => input.value = "");

quantidadeEntradas = 1;
renderEntradas();

  } catch (e) {
    console.error(e);

    closeOverlayNow();

    showEntradasFeedback(
      "Erro ao salvar entradas."
    );
  }
}

/* ===== CÓDIGOS DE ENTRADA - ALTERAR ===== */

function renderEntradasAlterar(valores = [""]) {
  const lista = document.getElementById("listaEntradasAlterar");
  if (!lista) return;

  lista.innerHTML = "";

  if (!valores.length) valores = [""];

  valores.slice(0, 10).forEach((valor, i) => {
    const input = document.createElement("input");

    input.type = "text";
    input.className = "entrada-cmb-input";
    input.placeholder = `Código de entrada ${i + 1}`;
    input.value = valor || "";

    lista.appendChild(input);
  });

  atualizarBotoesEntradasAlterar();
}


function atualizarBotoesEntradasAlterar() {
  const inputs = Array.from(
    document.querySelectorAll("#listaEntradasAlterar .entrada-cmb-input")
  );

  const btnMais = document.getElementById("btnAdicionarEntradaAlterar");
  const btnMenos = document.getElementById("btnRemoverEntradaAlterar");

  if (!inputs.length) return;

  btnMais.disabled =
    !inputs[inputs.length - 1].value.trim() ||
    inputs.length >= 10;

  btnMenos.disabled = inputs.length <= 1;
}


function adicionarEntradaAlterar() {
  const inputs = Array.from(
    document.querySelectorAll("#listaEntradasAlterar .entrada-cmb-input")
  );

  if (!inputs.length || inputs.length >= 10) return;

  if (!inputs[inputs.length - 1].value.trim()) return;

  const valores = inputs.map(input => input.value);

  valores.push("");

  renderEntradasAlterar(valores);

  document
    .querySelector("#listaEntradasAlterar .entrada-cmb-input:last-child")
    ?.focus();
}


function removerEntradaAlterar() {
  const inputs = Array.from(
    document.querySelectorAll("#listaEntradasAlterar .entrada-cmb-input")
  );

  if (inputs.length <= 1) return;

  const valores = inputs
    .slice(0, -1)
    .map(input => input.value);

  renderEntradasAlterar(valores);
}
