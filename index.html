<body class="is-index">
  <div class="page-center" style="--center-offset: -60px;">
  <a href="https://comicmarketbrasil.com.br/" target="_blank" rel="noopener noreferrer">
  <img src="assets/logo-cmb.png" alt="Comic Market Brasil" class="header-logo">
</a>

    <!-- LOGIN -->
    <div id="login-area" class="auth-card">
      <input type="password" id="chave" class="auth-input" placeholder="Digite sua chave de acesso" />
      <button id="btnEntrar" class="auth-btn" onclick="login()">Entrar</button>
    </div>

    <!-- LINKS (somem após login) -->
    <div id="login-links" class="btn-light-text">
      <a href="" target="_blank" rel="noopener noreferrer">
  Seja um expositor
</a>

<a href="" target="_blank" rel="noopener noreferrer">
  Participe da área dos Artistas
</a>
    </div>

    <!-- MENU (aparece após login) -->

 <div id="menu" class="auth-card" style="display:none;">
  <h3>Suas Páginas</h3>

  <p class="menu-hint">
    Nesse painel você compartilha informações para contrato, envia imagens e cria posts para divulgação.
    Seja bem vindo ao CMB!
  </p>

  <div id="botoes"></div>
</div>

<!-- Sair fora do box -->
<div id="logoutOutside" class="logout-outside" onclick="logout()">Sair</div>
  </div>  
  <!-- Overlay de loading -->
  <div id="loading">
    <div class="loading-bubble">Carregando páginas…</div>
  </div>

  <script>
    // Endpoint do seu Apps Script de auth/menu
    const API_URL = "https://script.google.com/macros/s/AKfycbyMbkkFdzYC_BfMsi5WKW6xbOKdjbNbW635vovOLYHGXdso2S_1a2Wdfvur790y0BM46g/exec";

    // CORES DOS BOTÕES (ajuste aqui no HTML, sem CSS)
const BUTTON_COLORS = ["#f1c40f", "#3498db", "#2ecc71", "#ff9ff3", "#e67e22", "#9b59b6"];
    
    // Definição das páginas do menu
    const paginas = [
      { nome: "expo_artistas",          label: "Área dos Artistas",        href: "artistas.html" },
      { nome: "expo_business",         label: "Expositor Área Business",  href: "expo_business.html" },
      { nome: "expo_market",           label: "Expositor Área Market",    href: "expo_market.html" },
      { nome: "cadastro_masterclass",  label: "Cadastro Masterclass",     href: "comic_learning.html" },
      { nome: "cadastro_lancamento",   label: "Cadastro de Lançamento",   href: "cadastro_lancamento.html" },
      { nome: "eu_vou",  label: "Eu vou CMB 2026!",     href: "euvou.html" },
      { nome: "convidado",  label: "Sou convidado!",     href: "convidado.html" },
    ];

    let isLoading = false;

    function setLoading(state) {
      isLoading = state;
      const btn = document.getElementById("btnEntrar");
      if (btn) {
        btn.disabled = state;
        btn.textContent = state ? "Carregando..." : "Entrar";
      }
    }

function showLoginUI() {
  const loginAr = document.getElementById("login-area");
  const loginLinks = document.getElementById("login-links");
  const menu = document.getElementById("menu");
  const area = document.getElementById("botoes");
  const chaveEl = document.getElementById("chave");
  const logoutOutside = document.getElementById("logoutOutside");

  if (menu) menu.style.display = "none";
  if (area) area.innerHTML = "";

  if (loginAr) loginAr.style.display = "block";

  if (loginLinks) {
    loginLinks.classList.remove("hidden");
    loginLinks.style.display = "block";
  }

  if (logoutOutside) logoutOutside.style.display = "none";  // <-- ADD
  if (chaveEl) chaveEl.value = "";
  setLoading(false);
}
function showMenuLoadingUI() {
  const loginAr = document.getElementById("login-area");
  const loginLinks = document.getElementById("login-links");
  const menu = document.getElementById("menu");
  const loading = document.getElementById("loading");
  const logoutOutside = document.getElementById("logoutOutside");

  if (loginAr) loginAr.style.display = "none";
  if (loginLinks) loginLinks.classList.add("hidden");
  if (menu) menu.style.display = "none";
  if (loading) loading.style.display = "grid";
  if (logoutOutside) logoutOutside.style.display = "none"; // <-- ADD
}

    function hideOverlay() {
      const loading = document.getElementById("loading");
      if (loading) loading.style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const isBack = params.get("back") === "1";
      const chave = (localStorage.getItem("chave") || "").trim();

      // Enter no campo
      const chaveEl = document.getElementById("chave");
      if (chaveEl) {
        chaveEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") login();
        });
      }

      // Estado inicial
      if (isBack && chave) {
        // voltando de outra página com sessão salva -> carrega menu direto
        const loginAr = document.getElementById("login-area");
        const loginLinks = document.getElementById("login-links");
        if (loginAr) loginAr.style.display = "none";
        if (loginLinks) loginLinks.classList.add("hidden");
        carregarMenu();
      } else {
        // primeira entrada -> limpa sessão e mostra login
        localStorage.removeItem("chave");
        showLoginUI();
      }
    });

    function login() {
      const chaveEl = document.getElementById("chave");
      const chave = (chaveEl?.value || "").trim();
      if (!chave) return alert("Digite sua chave.");

      localStorage.setItem("chave", chave);
      carregarMenu();
    }

    function logout() {
      localStorage.removeItem("chave");

      // limpa URL se voltou com back=1
      if (window.location.search.includes("back=1")) {
        window.history.replaceState({}, "", "index.html");
      }

      showLoginUI();
    }

 async function carregarMenu() {
  if (isLoading) return;

  const chave = (localStorage.getItem("chave") || "").trim();
  if (!chave) return;

  setLoading(true);
  showMenuLoadingUI();

  const menu = document.getElementById("menu");
  const area = document.getElementById("botoes");
  const logoutOutside = document.getElementById("logoutOutside");

  let algumPermitido = false;

  try {
    const resp = await fetch(`${API_URL}?chave=${encodeURIComponent(chave)}&menu=1&v=${Date.now()}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const data = await resp.json();

    // Aceita dois formatos: {permissoes:{...}} OU {paginas:{...}}
    const perms = data.permissoes || data.paginas || {};

    area.innerHTML = "";
    algumPermitido = false;

    paginas.forEach((pag, idx) => {
      if (perms[pag.nome]) {
        algumPermitido = true;

        const btn = document.createElement("button");
        btn.textContent = pag.label;
        btn.className = "menu-btn";

        // Cor do botão (ajuste as cores no array BUTTON_COLORS)
        const color = BUTTON_COLORS[idx % BUTTON_COLORS.length];
        btn.style.backgroundColor = color;

        btn.addEventListener("click", () => {
          window.location.href = pag.href || `${pag.nome}.html`;
        });

        area.appendChild(btn);
      }
    });

  } catch (err) {
    console.error(err);
    alert("Erro ao carregar. Tente novamente.");
    logout();
    return;

  } finally {
    hideOverlay();
    setLoading(false);
  }

  // ✅ Agora SIM: decide depois de montar tudo
  if (algumPermitido) {
    if (menu) menu.style.display = "block";
    if (logoutOutside) logoutOutside.style.display = "block";
  } else {
    alert("Acesso inválido.");
    logout();
  }
}
    
  </script>

  <script>
    // mede a altura real útil da janela e salva em --vh
    function setRealVh() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setRealVh();
    window.addEventListener('resize', setRealVh);
    window.addEventListener('orientationchange', setRealVh);
  </script>
